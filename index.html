<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Friend as Sister 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 15px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      margin-top: 15px;
    }

    h1 {
      color: #ff4b5c;
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      color: #444;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      background: #ff4b5c;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    .heart {
      font-size: 26px;
      animation: heartbeat 1.5s infinite;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 10px auto;
      display: block;
      border: 3px solid #ff4b5c;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>

<body>

  <!-- Input Section -->
  <div class="card">
    <h1>💌 Customize Your Wish</h1>
    <input type="text" id="nameInput" placeholder="Enter her name ❤️">
    <textarea id="messageInput" placeholder="Write your message..."></textarea>
    
    <input type="file" id="photoInput" accept="image/*">
    
    <button onclick="updateMessage()">Update Wish ✨</button>
  </div>

  <!-- Display Card -->
  <div class="card">
    
    <img id="photo" src="" alt="Her Photo" style="display:none;">

    <h1 id="title">💖 To My Best Friend 💖</h1>
    
    <p id="message">
      You are not just my best friend…  
      You are my sister by heart ❤️  
    </p>

    <div class="heart">❤️</div>
    <br>

    <button onclick="startConfetti()">Celebrate 🎉</button>
  </div>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    function updateMessage() {
      let name = document.getElementById("nameInput").value;
      let message = document.getElementById("messageInput").value;
      let photoInput = document.getElementById("photoInput");

      if (name !== "") {
        document.getElementById("title").innerHTML = "💖 For " + name + " 💖";
      }

      if (message !== "") {
        document.getElementById("message").innerText = message;
      }

      if (photoInput.files && photoInput.files[0]) {
        let reader = new FileReader();
        reader.onload = function(e) {
          let img = document.getElementById("photo");
          img.src = e.target.result;
          img.style.display = "block";
        }
        reader.readAsDataURL(photoInput.files[0]);
      }
    }

    function startConfetti() {
      var duration = 3 * 1000;
      var end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });

        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }
  </script>

</body>
</html>00000000000000000000000000000000
